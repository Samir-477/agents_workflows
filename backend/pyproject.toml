[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-aeo-audit-agent"
version = "0.1.0"
description = "Evidence-backed SEO/AEO audit workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-core>=1,<2",
    "langchain-groq>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "reportlab>=4,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
]

[project.scripts]
seo-audit-api = "seo_audit.api:run"
seo-audit-worker = "seo_audit.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
